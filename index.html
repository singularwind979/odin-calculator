<!DOCTYPE html>
<!-- Add appropriate language for your site -->
<html lang="en">
<head>
  <!-- `utf-8` is a character set including many universal characters -->
  <meta charset="utf-8">

  <!-- `viewport` ensures that items scale correctly on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- `title` sets the page title, which appears in the browser tab and search results.
   `author` sets your name and `description` provides a brief overview.
   Used by search engines. -->
  <title>Calculator</title>
  <meta name="author"      content="Singularwind">
  <meta name="description" content="Browser calculator built for The Odin Project Foundations curriculum.">

  <!-- `og` stands for Open Graph, a protocol for sharing content on social media.
   Used to create a share card. -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Calculator">
  <meta property="og:title"       content="Calculator">
  <meta property="og:description" content="Browser calculator built for The Odin Project Foundations curriculum.">

  <!-- CSS and JS entry points -->
  <link rel="stylesheet" href="css/index.css">
  <script type="module" src="dist/index.js"></script>
</head>

<body>
  <header>
    <h1 class="title">Calculator</h1>
  </header>

  <main>
    <output id="display"></output>
    <div id="keypad">
      <button class="area-clr" type="button" data-type="action" data-value="clear">Clr</button>
      <button class="area-del" type="button" data-type="action" data-value="delete">Del</button>
      <button class="area-eql" type="button" data-type="action" data-value="equal">=</button>
      <button class="area-0" type="button" data-type="digit" data-value="0">0</button>
      <button class="area-1" type="button" data-type="digit" data-value="1">1</button>
      <button class="area-2" type="button" data-type="digit" data-value="2">2</button>
      <button class="area-3" type="button" data-type="digit" data-value="3">3</button>
      <button class="area-4" type="button" data-type="digit" data-value="4">4</button>
      <button class="area-5" type="button" data-type="digit" data-value="5">5</button>
      <button class="area-6" type="button" data-type="digit" data-value="6">6</button>
      <button class="area-7" type="button" data-type="digit" data-value="7">7</button>
      <button class="area-8" type="button" data-type="digit" data-value="8">8</button>
      <button class="area-9" type="button" data-type="digit" data-value="9">9</button>
      <button class="area-dot" type="button" data-type="digit" data-value=".">.</button>
      <button class="area-add" type="button" data-type="operator" data-value="+">+</button>
      <button class="area-sub" type="button" data-type="operator" data-value="-">-</button>
      <button class="area-mul" type="button" data-type="operator" data-value="*">×</button>
      <button class="area-div" type="button" data-type="operator" data-value="/">÷</button>
    </div>
  </main>

  <footer>
    <p>&copy; <time datetime="2026">2026</time> Singularwind</p>
  </footer>
</body>
</html>
